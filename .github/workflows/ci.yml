name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Two inherited public dependencies are pinned with git+ssh URLs. CI runners do
# not have a GitHub SSH identity, so make those public fetches use HTTPS on every
# operating system without rewriting the lockfile at runtime.
env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: ssh://git@github.com/
  GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_1: "git@github.com:"

jobs:
  public-surface:
    name: Validate public metadata and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public metadata and developer scripts
        run: npm run check:public

  cross-platform:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run Build
        run: npm run build
      - name: Upload build result
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: paper-workbench-for-zotero-build
          path: .scaffold/build
